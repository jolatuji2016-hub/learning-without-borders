
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Without Borders - Student Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2, h3 { color: #123b68; text-align: center; }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      font-size: 16px;
      border-radius: 6px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: none;
      background: #123b68;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled { opacity: .6; }

    .logout { background: #b42318; }

    .profile {
      padding: 15px;
      margin: 15px 0;
      background: #eff6ff;
      border-radius: 8px;
    }

    .profile p { margin: 10px 0; }

    .message {
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    .error { background: #fee2e2; color: #991b1b; }
    .success { background: #dcfce7; color: #166534; }

    .small {
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    #dashboard, #loginMessage { display: none; }

    .assignment {
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 16px;
      margin: 14px 0;
      background: #fff;
    }

    .assignment h4 {
      margin: 0 0 12px;
      color: #123b68;
      font-size: 17px;
    }

    .assignment p {
      margin: 8px 0;
      font-size: 14px;
    }

    .open-link {
      display: block;
      text-align: center;
      padding: 12px;
      margin-top: 13px;
      background: #123b68;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 12px;
      text-transform: capitalize;
    }

    .section-message {
      text-align: center;
      color: #64748b;
      padding: 15px;
    }
  </style>
</head>

<body>
<div class="container">

  <h2>Learning Without Borders</h2>
  <p class="small">Student Learning Portal</p>

  <section id="loginSection">
    <h3>Student Login</h3>

    <form id="loginForm">
      <input type="text" id="studentId"
        placeholder="Enter your Student ID"
        autocomplete="username" required>

      <input type="password" id="studentPassword"
        placeholder="Enter your password"
        autocomplete="current-password" required>

      <button type="submit" id="loginButton">Login</button>
    </form>

    <div id="loginMessage" class="message"></div>
  </section>

  <section id="dashboard">

    <h3>Welcome to Your Dashboard</h3>

    <div class="profile">
      <p><strong>Student Name:</strong> <span id="displayName"></span></p>
      <p><strong>Student ID:</strong> <span id="displayId"></span></p>
      <p><strong>Class:</strong> <span id="displayClass"></span></p>
    </div>

    <h3>My Worksheets</h3>
    <div id="worksheetList">
      <p class="section-message">Loading your worksheets...</p>
    </div>

    <h3>My Performance</h3>
<div id="performance">
  <p class="section-message">Loading your results...</p>
</div>

    <button class="logout" id="logoutButton">Logout</button>
  </section>
</div>

<script>
  const SUPABASE_URL =
    "https://yzhqnlvhioocjumebbnb.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_fOLujlfzlMpfjQoHpmpcaQ_S1rKCt8e";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginSection = document.getElementById("loginSection");
  const dashboard = document.getElementById("dashboard");
  const loginMessage = document.getElementById("loginMessage");
  const worksheetList = document.getElementById("worksheetList");

  function showMessage(message, type) {
    loginMessage.textContent = message;
    loginMessage.className = "message " + type;
    loginMessage.style.display = "block";
  }

  function showDashboard() {
    loginSection.style.display = "none";
    dashboard.style.display = "block";
  }

  function showLogin() {
    dashboard.style.display = "none";
    loginSection.style.display = "block";
  }

  async function loadStudentProfile(user) {
    const { data, error } = await supabaseClient
      .from("student_profiles")
      .select("student_id, full_name, class_name")
      .eq("id", user.id)
      .single();

    if (error || !data) {
      await supabaseClient.auth.signOut();
      throw new Error("Student profile could not be loaded.");
    }

    document.getElementById("displayName").textContent = data.full_name;
    document.getElementById("displayId").textContent = data.student_id;
    document.getElementById("displayClass").textContent = data.class_name;

    showDashboard();
    await loadAssignments();
  }

  async function loadAssignments() {
    worksheetList.innerHTML =
      '<p class="section-message">Loading your worksheets...</p>';

    try {
      const { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();

      if (sessionError || !sessionData.session) {
        throw new Error("Your session has expired. Please log in again.");
      }

      const response = await fetch(
        SUPABASE_URL + "/functions/v1/get-student-assignments",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization": "Bearer " + sessionData.session.access_token
          },
          body: JSON.stringify({})
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.error || "Could not load worksheets.");
      }

      displayAssignments(result.assignments || []);

    } catch (error) {
      worksheetList.innerHTML = "";
      const message = document.createElement("p");
      message.className = "section-message";
      message.textContent = error.message;
      worksheetList.appendChild(message);
    }
  }


async function loadPerformance() {
  const performance = document.getElementById("performance");

  performance.innerHTML =
    '<p class="section-message">Loading your results...</p>';

  try {
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError || !sessionData.session) {
      throw new Error("Please log in again to view your results.");
    }

    const user = sessionData.session.user;

    const { data: results, error } = await supabaseClient
      .from("student_results")
      .select("worksheet_title, score, total_questions, correct_answers, submitted_at")
      .eq("student_id", user.id)
      .order("submitted_at", { ascending: false });

    if (error) throw error;

    performance.innerHTML = "";

    if (!results || results.length === 0) {
      performance.innerHTML =
        '<p class="section-message">You have not submitted any worksheets yet.</p>';
      return;
    }

    const totalPercentage = results.reduce(
      (sum, item) => sum + Number(item.score || 0), 0
    ) / results.length;

    const summary = document.createElement("div");
    summary.className = "profile";
    summary.innerHTML =
      "<p><strong>Worksheets completed:</strong> " + results.length + "</p>" +
      "<p><strong>Average score:</strong> " +
      totalPercentage.toFixed(1) + "%</p>";

    performance.appendChild(summary);

    results.forEach(function(item) {
      const card = document.createElement("div");
      card.className = "assignment";

      const title = document.createElement("h4");
      title.textContent = item.worksheet_title;

      const score = document.createElement("p");
      score.textContent =
        "Score: " + item.correct_answers + " / " + item.total_questions;

      const percentage = document.createElement("p");
      percentage.textContent = "Percentage: " + item.score + "%";

      const date = document.createElement("p");
      date.textContent = "Submitted: " + formatDate(item.submitted_at);

      card.appendChild(title);
      card.appendChild(score);
      card.appendChild(percentage);
      card.appendChild(date);

      performance.appendChild(card);
    });

  } catch (error) {
    performance.innerHTML = "";
    const message = document.createElement("p");
    message.className = "section-message";
    message.textContent = "Could not load results: " + error.message;
    performance.appendChild(message);
  }
}

  
  function displayAssignments(assignments) {
    worksheetList.innerHTML = "";

    if (assignments.length === 0) {
      worksheetList.innerHTML =
        '<p class="section-message">You have no assigned worksheets yet.</p>';
      return;
    }

    assignments.forEach(function(item) {
      const card = document.createElement("div");
      card.className = "assignment";

      const title = document.createElement("h4");
      title.textContent = item.worksheet_title;

      const assigned = document.createElement("p");
      assigned.textContent = "Assigned: " + formatDate(item.assigned_at);

      const due = document.createElement("p");
      due.textContent = "Due date: " +
        (item.due_date ? formatDate(item.due_date) : "Not specified");

      const status = document.createElement("span");
      status.className = "status";
      status.textContent = item.status || "assigned";

      const link = document.createElement("a");
      link.className = "open-link";
      link.href = item.worksheet_link;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Open Worksheet";

      card.appendChild(title);
      card.appendChild(assigned);
      card.appendChild(due);
      card.appendChild(status);
      card.appendChild(link);

      worksheetList.appendChild(card);
    });
  }

  function formatDate(value) {
    if (!value) return "Not specified";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "Not specified";

    return date.toLocaleDateString();
  }

  document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {
      event.preventDefault();

      const button = document.getElementById("loginButton");
      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        const studentId = document.getElementById("studentId").value.trim();
        const password = document.getElementById("studentPassword").value;

        if (!/^[A-Za-z0-9_-]{3,30}$/.test(studentId)) {
          throw new Error("Enter a valid Student ID.");
        }

        const studentEmail =
          studentId.toLowerCase() +
          "@students.learningwithoutborders.invalid";

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: studentEmail,
          password: password
        });

        if (error) {
          throw new Error("Invalid Student ID or password.");
        }

        await loadStudentProfile(data.user);

      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    }
  );

  async function checkSession() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) return;

    if (data.session) {
      try {
        await loadStudentProfile(data.session.user);
      } catch (error) {
        showLogin();
      }
    }
  }

  document.getElementById("logoutButton").addEventListener(
    "click",
    async function() {
      await supabaseClient.auth.signOut();
      document.getElementById("studentPassword").value = "";
      showLogin();
    }
  );

  checkSession();
</script>
</body>
</html>
